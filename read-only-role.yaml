AWSTemplateFormatVersion: '2010-09-09'
Description: Read-only IAM role with permissions to view AWS resource inventories

Resources:
  ReadOnlyRole:
    Type: AWS::IAM::Role
    Properties: 
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: 
                - "ec2.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      RoleName: ReadOnlyAccessRole

Outputs:
  RoleName:
    Value: !Ref ReadOnlyRole
    Export:
      Name: ReadOnlyAccessRoleName
